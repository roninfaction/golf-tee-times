name = "golf-tee-times-cron"
main = "index.js"
compatibility_date = "2024-09-23"

[triggers]
crons = ["*/15 * * * *"]

# CRON_SECRET is a Worker secret (never write it here: this repo is PUBLIC). Set it from
# .env.local with the piped command in index.js. APP_URL defaults to golf-tee-times.pages.dev.

# So a failed reminders call shows its reason in the dashboard, not just "exception".
[observability]
enabled = true
